<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mini Player YouTube</title>
<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
  }
  body{
    background:#111;
    color:white;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
  }

  /* ---------- anuncio ---------- */
  .ad-banner{
    width:100%;
    max-width:700px;
    margin-bottom:18px;
    background:linear-gradient(135deg,#1b1b1b,#262626);
    border:1px solid #3a3a3a;
    border-radius:14px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    transition:0.25s;
  }
  .ad-banner:hover{
    border-color:#E8A33D;
    transform:translateY(-1px);
  }
  .ad-banner .ad-dot{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#E8A33D;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#1b1303;
    font-size:14px;
  }
  .ad-banner .ad-text{
    flex:1;
    min-width:0;
  }
  .ad-banner .ad-text strong{
    display:block;
    font-size:0.95rem;
    color:#fff;
    margin-bottom:2px;
  }
  .ad-banner .ad-text span{
    font-size:0.78rem;
    color:#aaa;
  }
  .ad-banner .ad-cta{
    flex:0 0 auto;
    background:#E8A33D;
    color:#1b1303;
    font-size:0.78rem;
    font-weight:bold;
    padding:8px 14px;
    border-radius:30px;
    white-space:nowrap;
  }
  .ad-tag{
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#666;
    margin-bottom:6px;
    width:100%;
    max-width:700px;
  }

  .container{
    width:100%;
    max-width:700px;
    background:#1c1c1c;
    padding:30px;
    border-radius:16px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
  }
  h1{
    text-align:center;
    margin-bottom:25px;
  }
  .input-area{
    display:flex;
    gap:10px;
    margin-bottom:25px;
  }
  input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:16px;
  }
  button{
    padding:14px 22px;
    border:none;
    border-radius:10px;
    background:#ff0000;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
  }
  button:hover{
    background:#cc0000;
  }
  .player{
    width:100%;
    display:none;
    justify-content:center;
  }
  iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:14px;
  }
  @media(max-width:700px){
    iframe{
      height:250px;
    }
    .input-area{
      flex-direction:column;
    }
  }
</style>
</head>
<body>

  <div class="ad-tag">Publicidade</div>
  <a class="ad-banner" href="https://miniplayeryt.github.io/Paschoalotto/" target="_blank" rel="noopener">
    <span class="ad-dot">V</span>
    <span class="ad-text">
      <strong>Vinil — Mini Player de YouTube</strong>
      <span>Favoritos, fila de reprodução e backup do seu histórico</span>
    </span>
    <span class="ad-cta">Experimentar</span>
  </a>

  <div class="container">
    <h1>Mini Player YouTube</h1>
    <div class="input-area">
      <input
        type="text"
        id="youtubeLink"
        placeholder="Cole o link do YouTube aqui"
      >
      <button onclick="carregarVideo()">
        Abrir Vídeo
      </button>
    </div>
    <div class="player" id="player">
      <iframe
        id="youtubePlayer"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>
  </div>

<script>
function carregarVideo() {
  const link = document.getElementById("youtubeLink").value;
  let videoId = "";

  // LINK NORMAL
  if(link.includes("watch?v=")){
    videoId = link.split("watch?v=")[1].split("&")[0];
  }
  // LINK SHORT youtu.be
  else if(link.includes("youtu.be/")){
    videoId = link.split("youtu.be/")[1].split("?")[0];
  }

  if(videoId !== ""){
    const iframe = document.getElementById("youtubePlayer");
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    document.getElementById("player").style.display = "flex";
  } else {
    alert("Cole um link válido do YouTube.");
  }
}
</script>

</body>
</html>
