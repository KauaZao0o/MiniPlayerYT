<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Player YouTube</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#111;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:700px;
      background:#1c1c1c;
      padding:30px;
      border-radius:16px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
    }

    .input-area{
      display:flex;
      gap:10px;
      margin-bottom:25px;
    }

    input{
      flex:1;
      padding:14px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:16px;
    }

    button{
      padding:14px 22px;
      border:none;
      border-radius:10px;
      background:#ff0000;
      color:white;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    button:hover{
      background:#cc0000;
    }

    .player{
      width:100%;
      display:none;
      justify-content:center;
    }

    iframe{
      width:100%;
      height:400px;
      border:none;
      border-radius:14px;
    }

    @media(max-width:700px){
      iframe{
        height:250px;
      }

      .input-area{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Mini Player YouTube</h1>

    <div class="input-area">
      <input 
        type="text" 
        id="youtubeLink" 
        placeholder="Cole o link do YouTube aqui"
      >

      <button onclick="carregarVideo()">
        Abrir Vídeo
      </button>
    </div>

    <div class="player" id="player">
      <iframe 
        id="youtubePlayer"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <script>
    function carregarVideo() {

      const link = document.getElementById("youtubeLink").value;

      let videoId = "";

      // LINK NORMAL
      if(link.includes("watch?v=")){
        videoId = link.split("watch?v=")[1].split("&")[0];
      }

      // LINK SHORT youtu.be
      else if(link.includes("youtu.be/")){
        videoId = link.split("youtu.be/")[1].split("?")[0];
      }

      if(videoId !== ""){

        const iframe = document.getElementById("youtubePlayer");

        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;

        document.getElementById("player").style.display = "flex";

      } else {
        alert("Cole um link válido do YouTube.");
      }
    }
  </script>

</body>
</html>
